name: Windows Build (Clang)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ '**' ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-clang:
    runs-on: windows-2022
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Check for C/C++ Code Changes
        id: filter
        uses: tj-actions/changed-files@v44
        with:
          files: |
            Engine/**
            TimeEditor/**
            Vendor/**
            Scripts/**
            Premake5.lua
            .github/workflows/build-windows-clang.yml

      - name: Build Logger Dependency
        if: steps.filter.outputs.any_changed == 'true' || github.event_name == 'workflow_dispatch'
        shell: cmd
        run: |
          cd Vendor\Customizable_Logger
          if not exist build mkdir build
          cd build
          cmake .. -G "Visual Studio 17 2022" -T ClangCL -A x64
          cmake --build . --config Debug -- /m:1

      - name: Build GLFW Dependency
        if: steps.filter.outputs.any_changed == 'true' || github.event_name == 'workflow_dispatch'
        shell: cmd
        run: |
          cd Vendor\GLFW
          if not exist build mkdir build
          cd build
          cmake ../glfw -G "Visual Studio 17 2022" -T ClangCL -A x64 -DGLFW_BUILD_DOCS=OFF -DGLFW_BUILD_TESTS=OFF -DGLFW_BUILD_EXAMPLES=OFF
          cmake --build . --config Debug -- /m:1

      - name: Install Premake5
        if: steps.filter.outputs.any_changed == 'true' || github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/premake/premake-core/releases/download/v5.0.0-beta4/premake-5.0.0-beta4-windows.zip" -OutFile "premake5.zip"
          Expand-Archive -Path "premake5.zip" -DestinationPath "Vendor\Premake\Windows" -Force
          echo "$((Get-Item .).FullName)\Vendor\Premake\Windows" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Generate Solution with Premake
        if: steps.filter.outputs.any_changed == 'true' || github.event_name == 'workflow_dispatch'
        shell: cmd
        run: Vendor\Premake\Windows\premake5.exe vs2022

      - name: Setup MSBuild
        if: steps.filter.outputs.any_changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: microsoft/setup-msbuild@v2

      - name: Build Solution (ClangCL)
        if: steps.filter.outputs.any_changed == 'true' || github.event_name == 'workflow_dispatch'
        shell: cmd
        run: msbuild TimeEngine.sln /p:Configuration=Debug /p:Platform=x64 /p:PlatformToolset=ClangCL /m

      - name: Notify on Pull Request Failure
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const comment = `### [FAILED] Build Failure Alert: Windows (ClangCL)\n\nHey @${context.actor}, the Windows Clang build failed on \`${context.ref}\`.\n\n[View Full CI Run Logs](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`;
            const fs = require('fs');
            if (process.env.GITHUB_STEP_SUMMARY) {
              fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `\n${comment}\n`);
            }
            try {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            } catch (err) {
              console.warn('Could not post PR comment (likely fork PR without write permissions):', err.message);
            }
