name: Windows Build (MSVC)

on:
  pull_request:
    branches: [ '**' ]
  push:
    branches: [ '**' ]
  workflow_dispatch:

jobs:
  build-windows-msvc:
    runs-on: windows-2022
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Resolve Author Email
        id: author-info
        shell: pwsh
        run: |
          $email = "${{ github.event.pusher.email }}"
          if (-not $email -or $email -eq "null") {
            $email = git log -1 --pretty=format:'%ae'
          }
          echo "email=$email" >> $env:GITHUB_OUTPUT
          Write-Host "Resolved author email: $email"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build Logger Dependency
        shell: cmd
        run: |
          cd Vendor\Customizable_Logger
          if not exist build mkdir build
          cd build
          cmake .. -G "Visual Studio 17 2022" -A x64 -DCMAKE_C_FLAGS="/Z7" -DCMAKE_CXX_FLAGS="/Z7"
          cmake --build . --config Debug -- /m:1

      - name: Build GLFW Dependency
        shell: cmd
        run: |
          cd Vendor\GLFW
          if not exist build mkdir build
          cd build
          cmake ../glfw -G "Visual Studio 17 2022" -A x64 -DGLFW_BUILD_DOCS=OFF -DGLFW_BUILD_TESTS=OFF -DGLFW_BUILD_EXAMPLES=OFF -DCMAKE_C_FLAGS="/Z7 /FS" -DCMAKE_CXX_FLAGS="/Z7 /FS"
          cmake --build . --config Debug -- /m:1

      - name: Generate Solution with Premake
        shell: cmd
        run: Vendor\Premake\premake5.exe vs2022

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Solution
        shell: cmd
        run: msbuild TimeEngine.sln /p:Configuration=Debug /p:Platform=x64 /m

      - name: Notify on Pull Request Failure
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const comment = `### ❌ Build Failure Alert: Windows (MSVC)\n\nHey @${context.actor}, the Windows MSVC build failed on \`${context.ref}\`.\n\n[🔍 View Full CI Run Logs](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

      - name: Generate Professional Email
        if: failure()
        run: |
          python .github/scripts/send_notification.py \
            --workflow "Windows Build (MSVC)" \
            --status "FAILED" \
            --repo "${{ github.repository }}" \
            --branch "${{ github.ref_name }}" \
            --commit "${{ github.sha }}" \
            --author "${{ github.actor }}" \
            --email "${{ steps.author-info.outputs.email }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --output ".github/reports/msvc_failure.html"

      - name: Send Direct Email Notification to Causer
        if: failure() && env.MAIL_SERVER != '' && steps.author-info.outputs.email != ''
        env:
          MAIL_SERVER: ${{ secrets.MAIL_SERVER }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          server_port: ${{ secrets.MAIL_PORT || 465 }}
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "[TimeEngine CI Failure] Windows MSVC Build Failed on ${{ github.ref_name }}"
          to: ${{ steps.author-info.outputs.email }}
          from: ${{ secrets.MAIL_FROM || 'ci-bot@timeengine.org' }}
          html_body: file://.github/reports/msvc_failure.html
