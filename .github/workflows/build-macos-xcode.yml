name: macOS Build (Xcode)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ '**' ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-macos-xcode:
    runs-on: macos-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Check for C/C++ Code Changes
        id: filter
        uses: tj-actions/changed-files@v44
        with:
          files: |
            Engine/**
            TimeEditor/**
            Vendor/**
            Scripts/**
            Premake5.lua
            .github/workflows/build-macos-xcode.yml

      - name: Install Premake5
        if: steps.filter.outputs.any_changed == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p Vendor/Premake/Mac
          wget -q https://github.com/premake/premake-core/releases/download/v5.0.0-beta4/premake-5.0.0-beta4-macosx.tar.gz
          tar -xzf premake-5.0.0-beta4-macosx.tar.gz -C Vendor/Premake/Mac
          chmod +x Vendor/Premake/Mac/premake5
          sudo ln -sf "$(pwd)/Vendor/Premake/Mac/premake5" /usr/local/bin/premake5

      - name: Build Logger Dependency (Apple Clang)
        if: steps.filter.outputs.any_changed == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p Vendor/Customizable_Logger/build
          cd Vendor/Customizable_Logger/build
          cmake .. -DCMAKE_BUILD_TYPE=Debug -DCMAKE_POSITION_INDEPENDENT_CODE=ON -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          cmake --build . --config Debug

      - name: Build GLFW Dependency (Apple Clang)
        if: steps.filter.outputs.any_changed == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p Vendor/GLFW/build
          cd Vendor/GLFW/build
          cmake ../glfw -DGLFW_BUILD_DOCS=OFF -DGLFW_BUILD_TESTS=OFF -DGLFW_BUILD_EXAMPLES=OFF -DCMAKE_BUILD_TYPE=Debug -DCMAKE_POSITION_INDEPENDENT_CODE=ON -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          cmake --build . --config Debug

      - name: Generate Xcode Workspace with Premake
        if: steps.filter.outputs.any_changed == 'true' || github.event_name == 'workflow_dispatch'
        run: premake5 xcode4 --file=Premake5.lua

      - name: Build Xcode Project
        if: steps.filter.outputs.any_changed == 'true' || github.event_name == 'workflow_dispatch'
        run: xcodebuild -workspace TimeEngine.xcworkspace -scheme TimeEditor -configuration Debug -destination 'platform=macOS' build

      - name: Notify on Pull Request Failure
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const comment = `### [FAILED] Build Failure Alert: macOS (Xcode)\n\nHey @${context.actor}, the macOS Xcode build failed on \`${context.ref}\`.\n\n[View Full CI Run Logs](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`;
            const fs = require('fs');
            if (process.env.GITHUB_STEP_SUMMARY) {
              fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `\n${comment}\n`);
            }
            try {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            } catch (err) {
              console.warn('Could not post PR comment (likely fork PR without write permissions):', err.message);
            }
