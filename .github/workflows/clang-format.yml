name: Clang-Format Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ '**' ]

jobs:
  clang-format:
    runs-on: windows-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve Author Email
        id: author-info
        shell: pwsh
        run: |
          $email = "${{ github.event.pusher.email }}"
          if (-not $email -or $email -eq "null") {
            $email = git log -1 --pretty=format:'%ae'
          }
          echo "email=$email" >> $env:GITHUB_OUTPUT
          Write-Host "Resolved author email: $email"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v44
        with:
          files: |
            **/*.{h,hpp,c,cpp}
            !Vendor/**
            !Bin/**
            !Bin-Intermediate/**

      - name: Install clang-format
        run: |
          choco install llvm -y

      - name: Run clang-format and fix
        if: steps.changed-files.outputs.any_changed == 'true'
        shell: pwsh
        run: |
          $changedFiles = "${{ steps.changed-files.outputs.all_changed_files }}"
          if ($changedFiles.Trim() -ne "") {
            $files = $changedFiles -split ' '
            foreach ($file in $files) {
              if (Test-Path $file) {
                Write-Host "Formatting $file"
                clang-format -i $file
              }
            }
          }

      - name: Commit changes
        if: steps.changed-files.outputs.any_changed == 'true' && github.event_name == 'push'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Fix CI: Automated Clang-Format"

      - name: Verify Clang-Format on Pull Requests
        if: steps.changed-files.outputs.any_changed == 'true' && github.event_name == 'pull_request'
        shell: pwsh
        run: |
          $status = git status --porcelain
          if ($status) {
            Write-Error "Clang-Format check failed! Code formatting issues detected. Please run clang-format locally."
            git diff
            exit 1
          }

      - name: Notify on Pull Request Failure
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const comment = `### ❌ Formatting Check Failed (Clang-Format)\n\nHey @${context.actor}, code formatting violations were detected on \`${context.ref}\`.\n\nPlease run \`clang-format -i <files>\` locally and push to resolve.\n\n[🔍 View Run Logs](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

      - name: Generate Professional Email
        if: failure()
        shell: pwsh
        run: |
          python .github/scripts/send_notification.py `
            --workflow "Clang-Format Check" `
            --status "FAILED" `
            --repo "${{ github.repository }}" `
            --branch "${{ github.ref_name }}" `
            --commit "${{ github.sha }}" `
            --author "${{ github.actor }}" `
            --email "${{ steps.author-info.outputs.email }}" `
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" `
            --output ".github/reports/clang_format_failure.html"

      - name: Send Direct Email Notification to Causer
        if: failure() && env.MAIL_SERVER != '' && steps.author-info.outputs.email != ''
        env:
          MAIL_SERVER: ${{ secrets.MAIL_SERVER }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          server_port: ${{ secrets.MAIL_PORT || 465 }}
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "[TimeEngine CI Failure] Clang-Format Check Failed on ${{ github.ref_name }}"
          to: ${{ steps.author-info.outputs.email }}
          from: ${{ secrets.MAIL_FROM || 'ci-bot@timeengine.org' }}
          html_body: file://.github/reports/clang_format_failure.html
