name: Clang-Format Check

on:
  push:
    branches: [ main, ecs, editor, gameplay, ui, samples ]
  pull_request:
    branches: [ main, ecs, editor, gameplay, ui, samples ]

jobs:
  clang-format:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v44
        with:
          files: |
            **/*.{h,hpp,c,cpp}
            !Vendor/**
            !Bin/**
            !Bin-Intermediate/**

      - name: Install clang-format
        run: |
          choco install llvm -y

      - name: Run clang-format and fix
        if: steps.changed-files.outputs.any_changed == 'true'
        shell: pwsh
        run: |
          $changedFiles = "${{ steps.changed-files.outputs.all_changed_files }}"
          if ($changedFiles.Trim() -ne "") {
            $files = $changedFiles -split ' '
            foreach ($file in $files) {
              if (Test-Path $file) {
                Write-Host "Formatting $file"
                clang-format -i $file
              }
            }
          }

      - name: Commit changes
        if: steps.changed-files.outputs.any_changed == 'true' && github.event_name == 'push'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Fix CI: Automated Clang-Format"

      - name: Verify Clang-Format on Pull Requests
        if: steps.changed-files.outputs.any_changed == 'true' && github.event_name == 'pull_request'
        shell: pwsh
        run: |
          $status = git status --porcelain
          if ($status) {
            Write-Error "Clang-Format check failed! Code formatting issues detected. Please run clang-format locally."
            git diff
            exit 1
          }

