name: Sync Roadmap Milestones

on:
  push:
    branches: [ main, WINDOWS ]
    paths:
      - 'Docs/ROADMAP.md'
      - 'ROADMAP.md'
      - '.github/workflows/sync-roadmap.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  issues: write
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install @octokit/action

      - name: Run sync script
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.ADMIN_PAT || secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');

            const sleep = ms => new Promise(r => setTimeout(r, ms));

            // Helper to delete an issue via GraphQL API
            const deleteIssueGraphQL = async (issueNodeId) => {
              const mutation = `
                mutation($input: DeleteIssueInput!) {
                  deleteIssue(input: $input) {
                    clientMutationId
                  }
                }
              `;
              try {
                await github.graphql(mutation, {
                  input: {
                    issueId: issueNodeId
                  }
                });
                console.log(`Deleted issue node: ${issueNodeId}`);
              } catch (err) {
                console.error(`GraphQL deletion failed for node ${issueNodeId}:`, err.message);
              }
            };

            let roadmapPath = path.join(process.env.GITHUB_WORKSPACE, 'Docs', 'ROADMAP.md');
            if (!fs.existsSync(roadmapPath)) {
              roadmapPath = path.join(process.env.GITHUB_WORKSPACE, 'ROADMAP.md');
            }
            if (!fs.existsSync(roadmapPath)) {
              console.log("ROADMAP.md not found in Docs/ or workspace root.");
              return;
            }
            const content = fs.readFileSync(roadmapPath, 'utf8');
            const lines = content.split('\n');

            const milestones = [];
            let currentSection = "General";
            let currentMilestone = null;
            let currentIssue = null;

            for (let i = 0; i < lines.length; i++) {
              const line = lines[i].trim();

              // Section Header: ## 🟢 Completed, ## 🟡 Short-Term, ## 🔴 Long-Term
              const sectionMatch = line.match(/^##\s+.*?([🟢🟡🔴]?\s*(?:Completed|Short-Term|Long-Term)[^(\n]*).*$/i);
              if (sectionMatch) {
                currentSection = sectionMatch[1].replace(/[🟢🟡🔴]/g, '').trim();
                continue;
              }

              // Milestone Header: ### [Milestone: "Title" | Section: Short-Term] or fallback ### 1. Title
              const milestoneMatch = line.match(/^###\s+\[Milestone:\s*"([^"]+)"(?:\s*\|\s*Section:\s*([^\]]+))?\]/i) ||
                                     line.match(/^###\s+(.*)$/);
              if (milestoneMatch) {
                const title = milestoneMatch[1].replace(/^\[Milestone:\s*"([^"]+)".*$/i, '$1').trim();
                const section = (milestoneMatch[2] || currentSection).trim();
                currentMilestone = {
                  rawTitle: title,
                  section: section,
                  description: "",
                  issues: []
                };
                milestones.push(currentMilestone);
                currentIssue = null;
                continue;
              }

              // Milestone Description: > **Description**: ...
              if (currentMilestone && !currentIssue) {
                const descMatch = line.match(/^>\s*(?:\*\*Description\*\*:)?\s*(.*)$/i);
                if (descMatch && descMatch[1].trim()) {
                  currentMilestone.description = descMatch[1].trim();
                  continue;
                }
              }

              // Issue Header: #### [Issue: "Title" | Tags: Renderer, 2D | Status: completed] or fallback - [ ] **Title**
              const issueMatch = line.match(/^####\s+\[Issue:\s*"([^"]+)"(?:\s*\|\s*Tags:\s*([^|\]]+))?(?:\s*\|\s*Status:\s*([^\]]+))?\]/i);
              if (issueMatch && currentMilestone) {
                const rawTags = issueMatch[2] ? issueMatch[2].split(',').map(t => t.trim()) : [];
                const status = issueMatch[3] ? issueMatch[3].trim().toLowerCase() : 'todo';
                currentIssue = {
                  title: issueMatch[1].trim(),
                  tags: rawTags,
                  status: status,
                  description: "",
                  subtasks: []
                };
                currentMilestone.issues.push(currentIssue);
                continue;
              }

              // Legacy / Fallback bullet items: - [ ] ...
              const legacyItemMatch = line.match(/^-\s+\[([ xX\/])\]\s+(.*)$/);
              if (legacyItemMatch && currentMilestone && !currentIssue) {
                const state = legacyItemMatch[1].toLowerCase();
                const desc = legacyItemMatch[2].trim();
                currentMilestone.issues.push({
                  title: desc,
                  tags: ['roadmap-task'],
                  status: state === 'x' ? 'completed' : (state === '/' ? 'in-progress' : 'todo'),
                  description: desc,
                  subtasks: []
                });
                continue;
              }

              // Issue Description & Subtasks
              if (currentIssue) {
                const issueDescMatch = line.match(/^-\s+\*\*Description\*\*:\s*(.*)$/i);
                if (issueDescMatch) {
                  currentIssue.description = issueDescMatch[1].trim();
                  continue;
                }

                // Sub-tasks list: - [x] Subissue: ... or - [ ] Subissue: ...
                const subtaskMatch = line.match(/^-\s+\[([ xX\/])\]\s+(?:Subissue:\s*)?(.*)$/i);
                if (subtaskMatch) {
                  currentIssue.subtasks.push({
                    state: subtaskMatch[1].toLowerCase(),
                    description: subtaskMatch[2].trim()
                  });
                  continue;
                }
              }
            }

            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // Fetch all milestones (open and closed)
            const { data: existingMilestones } = await github.rest.issues.listMilestones({
              owner,
              repo,
              state: 'all',
              per_page: 100
            });

            console.log("Fetching all issues...");
            const existingIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'all',
              per_page: 100
            });
            console.log(`Total issues fetched: ${existingIssues.length}`);

            // Pre-process milestones for naming and completion status
            for (const milestone of milestones) {
              const totalIssues = milestone.issues.length;
              const completedIssues = milestone.issues.filter(i => i.status === 'completed' || i.status === 'closed').length;
              const isCompleted = totalIssues > 0 && completedIssues === totalIssues;

              const sectionPrefix = isCompleted ? "Completed" : milestone.section;
              milestone.name = `[${sectionPrefix}] ${milestone.rawTitle}`;
              milestone.isCompleted = isCompleted;
            }

            // Cleanup step: Delete legacy/renamed milestones
            const seenMilestones = new Set();
            for (const m of existingMilestones) {
              const isCurrentMilestoneName = milestones.some(mil => mil.name === m.title);

              if (!isCurrentMilestoneName || seenMilestones.has(m.title)) {
                console.log(`Deleting legacy/duplicate milestone: "${m.title}" (ID: ${m.number})`);
                try {
                  await github.rest.issues.deleteMilestone({
                    owner,
                    repo,
                    milestone_number: m.number
                  });
                  await sleep(500);
                } catch (err) {
                  console.error(`Failed to delete milestone ${m.title}: ${err.message}`);
                }
              } else {
                seenMilestones.add(m.title);
              }
            }

            // Refetch active milestones after cleanup
            const { data: activeMilestones } = await github.rest.issues.listMilestones({
              owner,
              repo,
              state: 'all',
              per_page: 100
            });

            // Process each Milestone and its Issues
            for (const milestoneData of milestones) {
              const milestoneTitle = milestoneData.name;
              const totalIssues = milestoneData.issues.length;
              const completedIssues = milestoneData.issues.filter(i => i.status === 'completed' || i.status === 'closed').length;
              const targetMilestoneState = milestoneData.isCompleted ? 'closed' : 'open';

              let milestoneDesc = milestoneData.description 
                ? `${milestoneData.description}\n\nStatus: ${completedIssues}/${totalIssues} completed.`
                : `Tracked from ROADMAP.md. Status: ${completedIssues}/${totalIssues} completed.`;

              console.log(`Processing Milestone: "${milestoneTitle}" (${completedIssues}/${totalIssues} completed, state: ${targetMilestoneState})`);

              let milestone = activeMilestones.find(m => m.title === milestoneTitle);

              if (!milestone) {
                console.log(`Creating Milestone "${milestoneTitle}"`);
                const res = await github.rest.issues.createMilestone({
                  owner,
                  repo,
                  title: milestoneTitle,
                  state: 'open',
                  description: milestoneDesc
                });
                milestone = res.data;
                await sleep(500);
              }

              // Active issue titles in this milestone
              const activeIssueTitles = milestoneData.issues.map(i => i.title);

              // Remove or dissociate unmapped issues in this milestone
              const issuesInMilestone = existingIssues.filter(i => i.milestone?.number === milestone.number);
              for (const issue of issuesInMilestone) {
                if (!activeIssueTitles.includes(issue.title)) {
                  console.log(`Unlinking/closing unmapped issue #${issue.number} ("${issue.title}") from Milestone #${milestone.number}`);
                  try {
                    await github.rest.issues.update({
                      owner,
                      repo,
                      issue_number: issue.number,
                      milestone: null,
                      state: 'closed'
                    });
                    await sleep(300);
                  } catch (err) {
                    console.error(`Failed to unlink issue #${issue.number}: ${err.message}`);
                  }
                  await deleteIssueGraphQL(issue.node_id);
                  await sleep(300);
                }
              }

              // Create or Sync each Issue
              for (const iss of milestoneData.issues) {
                const issueTitle = iss.title;
                const isIssueCompleted = iss.status === 'completed' || iss.status === 'closed';
                const targetIssueState = isIssueCompleted ? 'closed' : 'open';

                // Build rich issue body
                let issueBody = `### 📋 Overview\n${iss.description || 'Tracked from TimeEngine Roadmap.'}\n\n`;
                issueBody += `**Milestone**: [${milestoneTitle}](https://github.com/${owner}/${repo}/milestone/${milestone.number})\n`;
                if (iss.tags && iss.tags.length > 0) {
                  issueBody += `**Subsystem Tags**: \`${iss.tags.join('`, `')}\`\n\n`;
                }

                if (iss.subtasks && iss.subtasks.length > 0) {
                  issueBody += `### 🧩 Sub-Tasks & Deliverables\n`;
                  for (const st of iss.subtasks) {
                    const check = st.state === 'x' ? '[x]' : '[ ]';
                    issueBody += `- ${check} ${st.description}\n`;
                  }
                }

                // Resolve labels
                const issueLabels = ['roadmap', ...iss.tags];

                const matches = existingIssues.filter(i => i.title === issueTitle);
                let currentGitHubIssue = null;

                if (matches.length > 0) {
                  currentGitHubIssue = matches[0];
                  // Delete duplicate matches if any
                  for (let d = 1; d < matches.length; d++) {
                    console.log(`Deleting duplicate issue: #${matches[d].number} ("${matches[d].title}")`);
                    await deleteIssueGraphQL(matches[d].node_id);
                    await sleep(500);
                  }
                }
                try {
                  if (currentGitHubIssue) {
                    const needsMilestone = !currentGitHubIssue.milestone || currentGitHubIssue.milestone.number !== milestone.number;
                    const needsState = currentGitHubIssue.state !== targetIssueState;
                    // Normalize line endings before comparing to avoid \r\n vs \n false-positives
                    const normalizedExisting = (currentGitHubIssue.body || '').replace(/\r\n/g, '\n').trim();
                    const normalizedNew = issueBody.replace(/\r\n/g, '\n').trim();
                    const needsBody = normalizedExisting !== normalizedNew;

                    // Always force-close completed issues separately first —
                    // prevents milestone state being stuck at "0% complete" even if body is identical
                    if (needsState && targetIssueState === 'closed') {
                      console.log(`Force-closing completed issue #${currentGitHubIssue.number} ("${issueTitle}")`);
                      await github.rest.issues.update({
                        owner,
                        repo,
                        issue_number: currentGitHubIssue.number,
                        state: 'closed'
                      });
                      await sleep(500);
                    }

                    if (needsMilestone || needsBody) {
                      console.log(`Updating body/milestone for Issue: "${issueTitle}"`);
                      await github.rest.issues.update({
                        owner,
                        repo,
                        issue_number: currentGitHubIssue.number,
                        state: targetIssueState,
                        milestone: milestone.number,
                        body: issueBody,
                        labels: issueLabels
                      });
                      await sleep(500);
                    }
                  } else {
                    console.log(`Creating new Issue: "${issueTitle}" in Milestone #${milestone.number}`);
                    const newIssueRes = await github.rest.issues.create({
                      owner,
                      repo,
                      title: issueTitle,
                      milestone: milestone.number,
                      body: issueBody,
                      labels: issueLabels
                    });
                    await sleep(500);

                    // GitHub issues.create always opens issues as 'open'; if target state is 'closed', close it immediately
                    if (targetIssueState === 'closed') {
                      console.log(`Closing completed issue #${newIssueRes.data.number} ("${issueTitle}")`);
                      await github.rest.issues.update({
                        owner,
                        repo,
                        issue_number: newIssueRes.data.number,
                        state: 'closed'
                      });
                      await sleep(500);
                    }
                  }
                } catch (err) {
                  console.error(`Error processing issue "${issueTitle}": ${err.message}`);
                }
              }

              // Update milestone state and description now that all issues are in their target state
              console.log(`Finalizing Milestone "${milestoneTitle}" -> State: ${targetMilestoneState}`);
              await github.rest.issues.updateMilestone({
                owner,
                repo,
                milestone_number: milestone.number,
                state: targetMilestoneState,
                description: milestoneDesc
              });
              await sleep(500);
            }

            // ─── Final Safety Sweep ─────────────────────────────────────────────
            // After all milestones are processed, find every closed milestone that
            // still has open issues (orphaned from old roadmap runs) and close them.
            console.log("Running final safety sweep for closed milestones with open issues...");
            const { data: finalMilestones } = await github.rest.issues.listMilestones({
              owner,
              repo,
              state: 'closed',
              per_page: 100
            });
            for (const fm of finalMilestones) {
              if (fm.open_issues === 0) continue;
              console.log(`Closed milestone "${fm.title}" still has ${fm.open_issues} open issue(s). Closing them...`);
              const openIssues = await github.paginate(github.rest.issues.listForRepo, {
                owner,
                repo,
                milestone: fm.number,
                state: 'open',
                per_page: 100
              });
              for (const oi of openIssues) {
                console.log(`  Force-closing orphaned open issue #${oi.number} ("${oi.title}")`);
                await github.rest.issues.update({
                  owner,
                  repo,
                  issue_number: oi.number,
                  state: 'closed'
                });
                await sleep(300);
              }
            }
            console.log("Sync complete.");
