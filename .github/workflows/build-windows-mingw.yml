name: Windows Build (MinGW/GCC)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ '**' ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-mingw:
    runs-on: windows-2022
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Check for C/C++ Code Changes
        id: filter
        uses: tj-actions/changed-files@v44
        with:
          files: |
            Engine/**
            TimeEditor/**
            Vendor/**
            Scripts/**
            Premake5.lua
            .github/workflows/build-windows-mingw.yml

      - name: Setup MSYS2
        if: steps.filter.outputs.any_changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-make

      - name: Build Logger Dependency
        if: steps.filter.outputs.any_changed == 'true' || github.event_name == 'workflow_dispatch'
        shell: msys2 {0}
        run: |
          cd Vendor/Customizable_Logger
          mkdir -p build
          cd build
          cmake .. -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Debug
          mingw32-make SHELL=cmd.exe

      - name: Build GLFW Dependency
        if: steps.filter.outputs.any_changed == 'true' || github.event_name == 'workflow_dispatch'
        shell: msys2 {0}
        run: |
          cd Vendor/GLFW
          mkdir -p build
          cd build
          cmake ../glfw -G "MinGW Makefiles" -DGLFW_BUILD_DOCS=OFF -DGLFW_BUILD_TESTS=OFF -DGLFW_BUILD_EXAMPLES=OFF -DCMAKE_BUILD_TYPE=Debug
          mingw32-make SHELL=cmd.exe

      - name: Install Premake5
        if: steps.filter.outputs.any_changed == 'true' || github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/premake/premake-core/releases/download/v5.0.0-beta4/premake-5.0.0-beta4-windows.zip" -OutFile "premake5.zip"
          Expand-Archive -Path "premake5.zip" -DestinationPath "Vendor\Premake\Windows" -Force

      - name: Generate Makefiles with Premake
        if: steps.filter.outputs.any_changed == 'true' || github.event_name == 'workflow_dispatch'
        shell: msys2 {0}
        run: ./Vendor/Premake/Windows/premake5.exe gmake2 --file=Premake5.lua

      - name: Build Solution (MinGW GCC)
        if: steps.filter.outputs.any_changed == 'true' || github.event_name == 'workflow_dispatch'
        shell: msys2 {0}
        run: mingw32-make SHELL=cmd.exe config=debug -j$(nproc)