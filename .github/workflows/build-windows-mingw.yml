name: Windows Build (MinGW/GCC)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ '**' ]
  workflow_dispatch:

jobs:
  build-windows-mingw:
    runs-on: windows-2022
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Resolve Author Email
        id: author-info
        shell: pwsh
        run: |
          $email = "${{ github.event.pusher.email }}"
          if (-not $email -or $email -eq "null") {
            $email = git log -1 --pretty=format:'%ae'
          }
          echo "email=$email" >> $env:GITHUB_OUTPUT
          Write-Host "Resolved author email: $email"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-make

      - name: Build Logger Dependency
        shell: msys2 {0}
        run: |
          cd Vendor/Customizable_Logger
          mkdir -p build
          cd build
          cmake .. -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Debug
          mingw32-make SHELL=cmd.exe

      - name: Build GLFW Dependency
        shell: msys2 {0}
        run: |
          cd Vendor/GLFW
          mkdir -p build
          cd build
          cmake ../glfw -G "MinGW Makefiles" -DGLFW_BUILD_DOCS=OFF -DGLFW_BUILD_TESTS=OFF -DGLFW_BUILD_EXAMPLES=OFF -DCMAKE_BUILD_TYPE=Debug
          mingw32-make SHELL=cmd.exe

      - name: Install Premake5
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/premake/premake-core/releases/download/v5.0.0-beta4/premake-5.0.0-beta4-windows.zip" -OutFile "premake5.zip"
          Expand-Archive -Path "premake5.zip" -DestinationPath "Vendor\Premake\Windows" -Force

      - name: Generate Makefiles with Premake
        shell: msys2 {0}
        run: ./Vendor/Premake/Windows/premake5.exe gmake2 --file=Premake5.lua

      - name: Build Solution (MinGW GCC)
        shell: msys2 {0}
        run: mingw32-make SHELL=cmd.exe config=debug -j$(nproc)

      - name: Notify on Pull Request Failure
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const comment = `### ❌ Build Failure Alert: Windows (MinGW/GCC)\n\nHey @${context.actor}, the Windows MinGW build failed on \`${context.ref}\`.\n\n[🔍 View Full CI Run Logs](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

      - name: Generate Professional Email
        if: failure()
        shell: pwsh
        run: |
          python .github/scripts/send_notification.py `
            --workflow "Windows Build (MinGW/GCC)" `
            --status "FAILED" `
            --repo "${{ github.repository }}" `
            --branch "${{ github.ref_name }}" `
            --commit "${{ github.sha }}" `
            --author "${{ github.actor }}" `
            --email "${{ steps.author-info.outputs.email }}" `
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" `
            --output ".github/reports/mingw_failure.html"

      - name: Send Direct Email Notification to Causer
        if: failure() && env.MAIL_SERVER != '' && steps.author-info.outputs.email != ''
        env:
          MAIL_SERVER: ${{ secrets.MAIL_SERVER }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          server_port: ${{ secrets.MAIL_PORT || 465 }}
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "[TimeEngine CI Failure] Windows MinGW Build Failed on ${{ github.ref_name }}"
          to: ${{ steps.author-info.outputs.email }}
          from: ${{ secrets.MAIL_FROM || 'ci-bot@timeengine.org' }}
          html_body: file://.github/reports/mingw_failure.html
