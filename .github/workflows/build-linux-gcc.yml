name: Linux Build (GCC)

on:
  pull_request:
    branches: [ '**' ]
  push:
    branches: [ '**' ]
  workflow_dispatch:

jobs:
  build-linux-gcc:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Resolve Author Email
        id: author-info
        run: |
          AUTHOR_EMAIL="${{ github.event.pusher.email }}"
          if [ -z "$AUTHOR_EMAIL" ] || [ "$AUTHOR_EMAIL" = "null" ]; then
            AUTHOR_EMAIL=$(git log -1 --pretty=format:'%ae')
          fi
          echo "email=$AUTHOR_EMAIL" >> $GITHUB_OUTPUT
          echo "Resolved author email: $AUTHOR_EMAIL"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libglu1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxxf86vm-dev xorg-dev

      - name: Install Premake5
        run: |
          wget -q https://github.com/premake/premake-core/releases/download/v5.0.0-beta2/premake-5.0.0-beta2-linux.tar.gz
          tar -xzf premake-5.0.0-beta2-linux.tar.gz
          sudo mv premake5 /usr/local/bin/

      - name: Build Logger Dependency (GCC)
        run: |
          mkdir -p Vendor/Customizable_Logger/build
          cd Vendor/Customizable_Logger/build
          cmake .. -DCMAKE_BUILD_TYPE=Debug -DCMAKE_POSITION_INDEPENDENT_CODE=ON -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++
          cmake --build . --config Debug

      - name: Build GLFW Dependency (GCC)
        run: |
          mkdir -p Vendor/GLFW/build
          cd Vendor/GLFW/build
          cmake ../glfw -DGLFW_BUILD_WAYLAND=OFF -DGLFW_BUILD_DOCS=OFF -DGLFW_BUILD_TESTS=OFF -DGLFW_BUILD_EXAMPLES=OFF -DCMAKE_BUILD_TYPE=Debug -DCMAKE_POSITION_INDEPENDENT_CODE=ON -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++
          cmake --build . --config Debug

      - name: Generate Makefiles with Premake
        run: premake5 gmake2 --file=Premake5.lua

      - name: Build Solution (GCC)
        run: make config=debug -j$(nproc) CC=gcc CXX=g++

      - name: Notify on Pull Request Failure
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const comment = `### ❌ Build Failure Alert: Linux (GCC)\n\nHey @${context.actor}, the Linux GCC build failed on \`${context.ref}\`.\n\n[🔍 View Full CI Run Logs](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

      - name: Generate Professional Email
        if: failure()
        run: |
          python .github/scripts/send_notification.py \
            --workflow "Linux Build (GCC)" \
            --status "FAILED" \
            --repo "${{ github.repository }}" \
            --branch "${{ github.ref_name }}" \
            --commit "${{ github.sha }}" \
            --author "${{ github.actor }}" \
            --email "${{ steps.author-info.outputs.email }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --output ".github/reports/linux_gcc_failure.html"

      - name: Send Direct Email Notification to Causer
        if: failure() && env.MAIL_SERVER != '' && steps.author-info.outputs.email != ''
        env:
          MAIL_SERVER: ${{ secrets.MAIL_SERVER }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          server_port: ${{ secrets.MAIL_PORT || 465 }}
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "[TimeEngine CI Failure] Linux GCC Build Failed on ${{ github.ref_name }}"
          to: ${{ steps.author-info.outputs.email }}
          from: ${{ secrets.MAIL_FROM || 'ci-bot@timeengine.org' }}
          html_body: file://.github/reports/linux_gcc_failure.html
